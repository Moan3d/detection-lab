name: Sigma Validate and Compile

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install sigma-cli
        run: pip install sigma-cli pySigma-backend-splunk

      - name: Validate all rules
        run: sigma check rules/

      - name: Compile to Splunk SPL
        run: |
          mkdir -p compiled/splunk/by_technique

          # Combined file
          sigma convert -t splunk -p splunk_windows rules/ \
            > compiled/splunk/all_rules.spl

          # Individual files
          for rule in rules/*.yml; do
            name=$(basename "$rule" .yml)
            sigma convert -t splunk -p splunk_windows "$rule" \
              > "compiled/splunk/by_technique/${name}.spl"
          done
      - name: Commit compiled rules back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add compiled/splunk/all_rules.spl
          git diff --staged --quiet || git commit -m "ci: auto-compile sigma rules to splunk SPL"
          git push
