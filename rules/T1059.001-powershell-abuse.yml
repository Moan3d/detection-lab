title: Suspicious PowerShell Execution
id: a2f93e6a-b4c1-48d2-9e31-7c4f8b2e1d09
status: experimental
description: Detects suspicious PowerShell execution patterns used by attackers
    to download and execute code, bypass defenses, or run encoded commands.
author: Mohaned
date: 2026-09-20
references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_suspicious_args:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - 'DownloadString'
            - 'IEX'
            - 'Invoke-Expression'
            - '-WindowStyle Hidden'
            - 'Net.WebClient'
            - 'FromBase64String'
            - '-NonInteractive'
            - 'bypass'
            - 'Invoke-WebRequest'
            - '-NoLogo'
    selection_hidden:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - '-w '
            - 'hidden'
    condition: selection_suspicious_args or selection_hidden
falsepositives:
    - Legitimate admin scripts
    - Software installers
level: medium
