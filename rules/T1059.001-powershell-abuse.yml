title: Suspicious PowerShell Execution
id: a2f93e6a-b4c1-48d2-9e31-7c4f8b2e1d09
status: experimental
description: Detects suspicious PowerShell execution patterns used by attackers
    to download and execute code, bypass defenses, or run encoded commands.
author: Mohaned Bakri
date: 2026-09-20
references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_encoded:
        CommandLine|contains|windash:
            - ' -e '
            - ' -en '
            - ' -enc '
            - ' -enco'
            - ' -ec '
    selection_cradle_download:
        CommandLine|contains:
            - 'DownloadString'
            - 'DownloadData'
            - 'Net.WebClient'
            - 'Invoke-WebRequest'
            - 'iwr '
    selection_cradle_exec:
        CommandLine|contains:
            - 'IEX'
            - 'Invoke-Expression'
    condition: selection_img and (selection_encoded or (selection_cradle_download and selection_cradle_exec))
falsepositives:
    - Legitimate admin scripts
    - Software installers
level: medium