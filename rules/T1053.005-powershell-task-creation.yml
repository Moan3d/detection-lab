title: Suspicious Scheduled Task powershell creation
id: 3b454a39-e6a8-4cc4-a56d-85eb68dd2b7d
status: experimental
description: Detects the creation of Windows Task Scheduler using powershell, with methods that are rare 
author: Mohaned Bakri
date: 2026-09-27
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
references:
    - 'https://attack.mitre.org/techniques/T1053/005/'
    - 'https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md#atomic-test-7-scheduled-task-executing-base64-encoded-commands-from-registry'
logsource:  
  category: process_creation
  product: windows
detection:
  selection_1:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Register-ScheduledTask'
            - 'New-ScheduledTaskAction'
            - 'PS_ScheduledTask'
            - 'Invoke-CimMethod'
            - 'New-ScheduledTaskAction'
  condition: selection_1
falsepositives:
  - administrators Scheduling tasks via powershell
level: high