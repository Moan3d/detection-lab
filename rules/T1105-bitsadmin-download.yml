title: bitsadmin Ingress Tool Transfer detection
id: b1da40da-dec9-4da3-9bf2-dbecdfaa9c07
status: experimental
description: detecting bitsadmin Ingress Tool Transfer, which is a post-exploitation technique to import a tooling into compromised machine
author: Mohaned Bakri
date: 2026-11-01
references:
  - https://redcanary.com/threat-detection-report/techniques/ingress-tool-transfer/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
  - https://lolbas-project.github.io
tags:
  - attack.command-and-control
  - attack.t1105
  
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\bitsadmin.exe'
    - OriginalFileName: 'bitsadmin.exe'
  selection_cmd:
    CommandLine|contains|windash:
      - '/transfer'
      - '/addfile'
  condition: all of selection_*
falsepositives:
    - Administraive tasks
level: medium
