title: Powershell Tool Download Detection
id: 0e003e97-89a8-4b25-8078-ed1cc2ae6edb
status: experimental
description: detecting T1105, which is a post-exploitation technique to import a tooling into compromised machine
author: Mohaned Bakri
date: 2026-11-01
references: 
  - https://redcanary.com/threat-detection-report/techniques/ingress-tool-transfer/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
tags:
  - attack.command-and-control
  - attack.t1105

logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
      - Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      - OriginalFileName:
          - 'PowerShell.EXE'
          - 'pwsh.dll'
  selection_method:
    CommandLine|contains:
      - 'Invoke-WebRequest'
      - 'DownloadFile'
      - 'client.GetAsync'
      - ' iwr '
      - 'WriteAllBytes'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'

  condition: all of selection_*
falsepositives:
    - Administraive tasks
level: medium











