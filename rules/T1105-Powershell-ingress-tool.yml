title: powershell tool downlowd detection
id: 0e003e97-89a8-4b25-8078-ed1cc2ae6edb
status: test
description: detecting T1105, which is a post-exploitation technique to import a tooling into compromised machine
author: Mohaned Bakri
date: 2026-11-01
references: 
  - https://redcanary.com/threat-detection-report/techniques/ingress-tool-transfer/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
tags:
  - attack.command-and-control
  - attack.t1105

logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - 'New-Object Net.WebClient'
      - 'Invoke-WebRequest'
      - 'DownloadFile'
      - 'DownloadString'
      - 'iwr'
      - 'client.GetAsync'
      - 'WriteAllBytes'
  selection_2:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
      - 'New-Object Net.WebClient'
      - 'Invoke-WebRequest'
      - 'DownloadFile'
      - 'DownloadString'
      - 'iwr'
  condition: 1 of selection_*
falsepositives:
    - Administraive tasks
level: medium

#C# and PowerShell are effectively just frontends for the .NET We are taking advantage of the fact that we can use C# executables to directly call the same .NET functionality that is accessed by PowerShell











