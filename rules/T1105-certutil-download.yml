title: Certutil Ingress Tool Transfer Detection
name: certutil_proc
id: 74227de8-7439-4168-8472-211d14f690d4
status: test
description: Detects certutil execution with download flags used to transfer external tools onto a compromised machine.
author: Mohaned Bakri
date: 2026-11-01
references:
  - https://redcanary.com
  - https://github.com
  - https://github.io
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-urlcache'
      - '-split'
      - '/urlcache'
      - '-verifyctl'
      - '/verifyctl'
      - '-URL'
  condition: selection_1
falsepositives:
  - Administrative tasks
level: high

