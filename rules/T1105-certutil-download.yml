title: Certutil Ingress Tool Transfer Detection
name: certutil_proc
id: 74227de8-7439-4168-8472-211d14f690d4
status: experimental
description: Detects certutil execution with download flags used to transfer external tools onto a compromised machine.
author: Mohaned Bakri
date: 2026-11-01
references:
  - https://redcanary.com/threat-detection-report/techniques/ingress-tool-transfer/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
  - https://lolbas-project.github.io
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_1:  
    CommandLine|contains|windash:
      - '-urlcache'
      - '-split'
      - '-verifyctl'
  condition: all of selection_*
falsepositives:
  - Administrative tasks
level: high

---

title: Certutil File Creation
name: certutil_file
id: 0b95b10f-3d19-4af0-b0a2-a7c6bb899dd2
status: test
description: Detects file creation events initiated by certutil.exe.
author: Mohaned Bakri
date: 2026-11-01
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: Sysmon Event ID 11 must be enabled'
detection:
  selection_1:
    Image|endswith: '\certutil.exe'
  condition: selection_1
level: medium

---

title: Certutil Ingress Download Followed by File Creation
id: d2641c2d-fd03-46b6-8773-445d78ab7448
status: test
description: Detects certutil downloading a file from a URL, immediately followed by file creation within 10 seconds.
author: Mohaned Bakri
date: 2026-11-01
tags:
  - attack.command-and-control
  - attack.t1105
correlation:
  type: temporal
  rules:
    - certutil_proc
    - certutil_file
  group-by:
    - Computer
    - ProcessId
  timespan: 2m
level: high
