title: Certutil Ingress Download Followed by File Creation
id: d2641c2d-fd03-46b6-8773-445d78ab7448
status: test
description: Detects certutil downloading a file from a URL, immediately followed by file creation within 10 seconds.
author: Mohaned Bakri
date: 2026-11-01
tags:
  - attack.command-and-control
  - attack.t1105
correlation:
  type: temporal_ordered
  rules:
    - 74227de8-7439-4168-8472-211d14f690d4
    - 0b95b10f-3d19-4af0-b0a2-a7c6bb899dd2
  group-by:
    - Computer
    - ProcessId
  timespan: 10s
  aliases:
    certutil_proc:
      74227de8-7439-4168-8472-211d14f690d4: ProcessId
    certutil_file:
      0b95b10f-3d19-4af0-b0a2-a7c6bb899dd2: ProcessId
  condition: certutil_proc then certutil_file
generate: true
level: high
