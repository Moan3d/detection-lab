title: LSASS Memory Access - Credential Dumping
id: 5ef4e3d6-c873-4ae2-a15a-74aa9de5b530
status: experimental
description: Detects attempts to access LSASS process memory for credential
    dumping using tools like Mimikatz, ProcDump, or WCE.
    Covers process access rights, known dump tools.
author: Mohaned Bakri
date: 2026-09-21
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://redcanary.com/threat-detection-report/techniques/lsass-memory/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection_suspicious_access:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1010'
            - '0x1410'
            - '0x1418'
            - '0x143a'
            - '0x1438'
            - '0x1f0fff'
            - '0x1f1fff'
            - '0x1f3fff'
    selection_known_tools:
        TargetImage|endswith: '\lsass.exe'
        SourceImage|endswith:
            - 'powershell.exe'
            - '\mimikatz.exe'
            - '\procdump.exe'
            - '\procdump64.exe'
            - '\sqldumper.exe'
            - '\wce.exe'
            - '\wce64.exe'
            - '\wce32.exe'
    filter_legitimate:
        SourceImage|endswith:
            - '\MRT.exe'
            - '\wininit.exe'
            - '\wmiprvse.exe'
            - '\csrss.exe'
            - '\lsm.exe'
            - '\msiexec.exe'
    condition: (selection_suspicious_access or selection_known_tools) and not filter_legitimate
falsepositives:
    - Security software and antivirus engines legitimately accessing LSASS
    - Windows Defender platform processes
    - Enterprise monitoring agents
level: high
