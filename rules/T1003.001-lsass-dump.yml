title: LSASS Memory Access - Credential Dumping
id: 5ef4e3d6-c873-4ae2-a15a-74aa9de5b530
status: experimental
description: Detects processes opening LSASS with access rights commonly used for
    credential dumping, or known dumping tools (Mimikatz, ProcDump, SQLDumper, WCE)
    accessing LSASS. Requires Sysmon Event ID 10 logging for lsass.exe.
author: Mohaned Bakri
date: 2026-09-21
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://redcanary.com/threat-detection-report/techniques/lsass-memory/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection_suspicious_access:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1418'
            - '0x143a'
            - '0x1438'
            - '0x1f0fff'
            - '0x1f1fff'
            - '0x1f3fff'
    selection_known_tools:
        TargetImage|endswith: '\lsass.exe'
        SourceImage|endswith:
            - '\powershell.exe'
            - '\mimikatz.exe'
            - '\procdump.exe'
            - '\procdump64.exe'
            - '\sqldumper.exe'
            - '\wce.exe'
            - '\wce64.exe'
            - '\wce32.exe'
    filter_main_system:
        SourceImage:
            - 'C:\Windows\System32\wininit.exe'
            - 'C:\Windows\System32\csrss.exe'
            - 'C:\Windows\System32\lsm.exe'
            - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
            - 'C:\Windows\System32\MRT.exe'
    filter_main_defender:
        SourceImage|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
        SourceImage|endswith: '\MsMpEng.exe'
    condition: (selection_suspicious_access or selection_known_tools) and not 1 of filter_main_*
falsepositives:
    - Security software and antivirus engines legitimately accessing LSASS
    - Windows Defender platform processes
    - Enterprise monitoring agents
level: high
