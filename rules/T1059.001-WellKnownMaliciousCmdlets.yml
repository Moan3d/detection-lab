title: Known Malicious Cmdlets
id: a38c0683-3ad0-47dc-b6f3-d3d3dc3e51ce 
status: experimental
description: Detects known malicious PowerShell cmdlets used by attackers, including PowerSploit, PowerView, and Mimikatz invocations.
author: Mohaned Bakri
date: 2026-09-21
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1059.001/T1059.001.md#atomic-test-18-powershell-invoke-known-malicious-cmdlets
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: ps_script
    product: windows
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    selection_img:
        - Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        - OriginalFileName:
            - 'PowerShell.EXE'
            - 'pwsh.dll'
    selection_cmd:
        ScriptBlockText|contains:
            - 'Add-Persistence'
            - 'Find-AVSignature'
            - 'Get-GPPAutologon'
            - 'Get-GPPPassword'
            - 'Get-HttpStatus'
            - 'Get-Keystrokes'
            - 'Get-SecurityPackages'
            - 'Get-TimedScreenshot'
            - 'Get-VaultCredential'
            - 'Get-VolumeShadowCopy'
            - 'Install-SSP'
            - 'Invoke-CredentialInjection'
            - 'Invoke-DllInjection'
            - 'Invoke-Mimikatz'
            - 'Invoke-NinjaCopy'
            - 'Invoke-Portscan'
            - 'Invoke-ReflectivePEInjection'
            - 'Invoke-ReverseDnsLookup'
            - 'Invoke-Shellcode'
            - 'Invoke-TokenManipulation'
            - 'Invoke-WmiCommand'
            - 'Mount-VolumeShadowCopy'
            - 'New-ElevatedPersistenceOption'
            - 'New-UserPersistenceOption'
            - 'New-VolumeShadowCopy'
            - 'Out-CompressedDll'
            - 'Out-EncodedCommand'
            - 'Out-EncryptedScript'
            - 'Out-Minidump'
            - 'PowerUp'
            - 'PowerView'
            - 'Remove-Comments'
            - 'Remove-VolumeShadowCopy'
            - 'Set-CriticalProcess'
            - 'Set-MasterBootRecord'
    condition: all of selection_*
falsepositives:
    - Red team or authorized penetration testing activity
    - Short names such as PowerUp or Get-HttpStatus matching unrelated paths or admin scripts
level: high
