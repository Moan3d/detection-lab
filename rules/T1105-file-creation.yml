title: lolbas Ingress Tool Transfer detection
id: 46163746-b214-4ab9-be0c-c03328f60531
status: test
description: detecting lolbas apps that used in ingress tool Transfer, which is a post-exploitation technique to import a tooling into compromised machine
author: Mohaned Bakri
date: 2026-11-01
references:
  - https://redcanary.com/threat-detection-report/techniques/ingress-tool-transfer/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
  - https://lolbas-project.github.io
tags:
  - attack.command-and-control
  - attack.t1105

logsource:
  category: file_creation
  product: windows
detection:
  selection_1:
    Image|endswith:
      - '\certoc.exe'
      - '\AppInstaller.exe'
      - '\CertReq.exe'
      - '\cmdl32.exe'
      - '\ConfigSecurityPolicy.exe'
      - '\Desktopimgdownldr.exe'
      - '\Diantz.exe'
      - '\Finger.exe'
      - '\Findstr.exe'
      - '\Extrac32.exe'
      - '\Expand.exe'
      - '\Esentutl.exe'
      - '\Ftp.exe'
      - '\Hh.exe'
      - '\IMEWDBLD.exe'
      - '\Ieexec.exe'
      - '\Makecab.exe'
      - '\Installutil.exe'
  condition: selection_1
level: low
# puting a lot of binaries in the same sigma rule will generate a lot of alerts and falsepositives, each one of them needs a saparet sigma rule, this could be a futur project 